<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#5c4b3a" />
  <title>Hoof Records 2.3</title>
  <style>:root {
  /* Vetlife V2.8 colour theme */
  --light-brown: #a79075;
  --dark-brown: #5c4b3a;

  --bg: #f4f0eb;
  --panel: #ffffff;
  --panel-soft: #f8f5f1;
  --text: #302820;
  --muted: #74685d;
  --line: #d8cfc5;

  /* Existing variable names retained so all app controls inherit the new theme */
  --green: var(--dark-brown);
  --green-dark: #493b2e;
  --green-soft: #eee8e1;

  /* Clinical severity colours remain traffic-light based */
  --amber: #b87511;
  --red: #a43a32;

  --shadow: 0 12px 30px rgba(92, 75, 58, 0.10);
  font-family: Inter, Arial, Helvetica, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
}

body {
  padding-bottom: env(safe-area-inset-bottom);
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

input, textarea {
  width: 100%;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: #fff;
  color: var(--text);
}

input:focus, textarea:focus, button:focus-visible {
  outline: 4px solid rgba(167, 144, 117, 0.35);
  outline-offset: 2px;
}

.hidden { display: none !important; }
.screen { display: none; }
.screen.active { display: block; }

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 22px;
  background: var(--dark-brown);
  color: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.14);
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 13px;
  background: rgba(255,255,255,0.16);
  font-weight: 800;
  letter-spacing: 0.03em;
}

.app-header h1 {
  margin: 0;
  font-size: 23px;
}

.app-header p {
  margin: 3px 0 0;
  font-size: 13px;
  opacity: 0.78;
}

.ghost-button {
  min-height: 44px;
  padding: 0 15px;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 12px;
  background: transparent;
  color: white;
  font-weight: 700;
}

.start-wrap {
  min-height: calc(100vh - 78px);
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 30px;
  align-items: center;
  width: min(1050px, 100%);
  margin: 0 auto;
  padding: 34px 22px;
}

.hero {
  padding: 20px;
}

.eyebrow {
  display: inline-block;
  margin-bottom: 10px;
  color: var(--green);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.hero h2, .summary-header h2 {
  margin: 0;
  font-size: clamp(34px, 5vw, 60px);
  line-height: 1.02;
}

.hero p, .summary-header p {
  max-width: 650px;
  color: var(--muted);
  font-size: 18px;
  line-height: 1.5;
}

.start-card,
.record-card,
.side-card,
.metric-card,
.summary-table-card {
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--panel);
  box-shadow: var(--shadow);
}

.start-card {
  padding: 24px;
}

.start-card label,
.record-card label,
.field-label {
  display: block;
  margin-bottom: 8px;
  font-weight: 800;
}

.start-card input,
.record-card input,
.record-card textarea,
.history-toolbar input {
  min-height: 58px;
  margin-bottom: 18px;
  padding: 13px 16px;
  font-size: 20px;
}

.segmented-wrap { margin-bottom: 20px; }

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.segmented button,
.choice-grid button,
.foot-grid button,
.score-grid button {
  border: 2px solid var(--line);
  background: #fff;
  color: var(--text);
  font-weight: 800;
}

.segmented button {
  min-height: 54px;
  border-radius: 14px;
  font-size: 18px;
}

.segmented button.selected,
.choice-grid button.selected,
.foot-grid button.selected {
  border-color: var(--light-brown);
  background: var(--green-soft);
  color: var(--green-dark);
}

.primary-xl {
  min-height: 68px;
  padding: 0 24px;
  border: 0;
  border-radius: 18px;
  background: var(--dark-brown);
  color: white;
  font-size: 23px;
  font-weight: 800;
}

.primary-xl:active { background: var(--green-dark); }

.privacy-note {
  margin: 14px 0 0;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.session-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  width: min(1180px, calc(100% - 28px));
  margin: 18px auto 14px;
  padding: 15px 18px;
  border-radius: 18px;
  background: var(--dark-brown);
  color: white;
}

.session-strip span {
  display: block;
  font-size: 21px;
  font-weight: 800;
}

.session-strip small {
  display: block;
  margin-top: 3px;
  opacity: 0.8;
}

.session-count {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.session-count strong {
  font-size: 29px;
}

.record-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 18px;
  width: min(1180px, calc(100% - 28px));
  margin: 0 auto 120px;
}

.record-card {
  padding: 22px;
}

.cow-number-block {
  padding: 18px;
  border-radius: 20px;
  background: var(--panel-soft);
  text-align: center;
}

.cow-number-block label {
  font-size: 20px;
}

.cow-number-block input {
  max-width: 560px;
  margin: 8px auto 0;
  padding: 12px 20px;
  text-align: center;
  font-size: 42px;
  font-weight: 800;
}

.section-block {
  margin-top: 28px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
}

.section-heading h2 {
  margin: 0;
  font-size: 24px;
}

.section-heading span {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.score-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.score {
  min-height: 78px;
  border-radius: 18px;
  font-size: 31px;
}

.score.selected {
  color: white;
  border-color: transparent;
}

.score-1.selected, .score-2.selected { background: var(--green); }
.score-3.selected { background: var(--amber); }
.score-4.selected, .score-5.selected { background: var(--red); }

.foot-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 11px;
}

.foot-grid button {
  min-height: 78px;
  border-radius: 18px;
}

.foot-grid strong {
  display: block;
  font-size: 27px;
}

.foot-grid span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 14px;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.choice-grid button {
  min-height: 66px;
  padding: 10px;
  border-radius: 16px;
  font-size: 17px;
}

.record-card textarea {
  min-height: 92px;
  resize: vertical;
}

.side-panel {
  display: grid;
  align-content: start;
  gap: 16px;
}

.side-card {
  padding: 18px;
}

.side-card h3 {
  margin: 0 0 13px;
  font-size: 20px;
}

.secondary-button,
.danger-button {
  min-height: 52px;
  padding: 0 16px;
  border-radius: 15px;
  font-weight: 800;
}

.secondary-button {
  border: 2px solid var(--line);
  background: white;
  color: var(--text);
}

.danger-button {
  border: 0;
  background: #9b302b;
  color: white;
}

.side-card .secondary-button {
  width: 100%;
  margin-bottom: 10px;
}

.last-saved {
  margin-top: 8px;
  padding: 13px;
  border-radius: 14px;
  background: var(--panel-soft);
  color: var(--muted);
  line-height: 1.45;
}

.compact-summary > div {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.compact-summary > div:last-child { border-bottom: 0; }

.sticky-actions {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: minmax(140px, 0.35fr) minmax(240px, 0.65fr);
  gap: 12px;
  width: min(1180px, calc(100% - 28px));
  padding: 12px;
  transform: translateX(-50%);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 20px 20px 0 0;
  background: rgba(255,255,255,0.96);
  box-shadow: 0 -10px 30px rgba(20,43,28,0.12);
  backdrop-filter: blur(8px);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 92px;
  z-index: 40;
  transform: translateX(-50%);
  min-width: 220px;
  max-width: calc(100% - 30px);
  padding: 13px 18px;
  border-radius: 14px;
  background: var(--dark-brown);
  color: white;
  text-align: center;
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease;
}

.toast.show { opacity: 1; }
.toast.error { background: #9b302b; }

.summary-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 20px;
  width: min(1180px, calc(100% - 28px));
  margin: 28px auto 18px;
}

.summary-header h2 {
  font-size: clamp(32px, 5vw, 52px);
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  width: min(1180px, calc(100% - 28px));
  margin: 0 auto 16px;
}

.metric-card {
  padding: 18px;
}

.metric-card span {
  display: block;
  color: var(--muted);
  font-size: 14px;
}

.metric-card strong {
  display: block;
  margin-top: 9px;
  font-size: 28px;
}

.summary-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: min(1180px, calc(100% - 28px));
  margin: 0 auto 16px;
}

.summary-table-card {
  width: min(1180px, calc(100% - 28px));
  margin: 0 auto 90px;
  padding: 18px;
}

.summary-table-card h3 {
  margin: 0 0 14px;
}

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}

th {
  background: var(--panel-soft);
  font-size: 13px;
}

.history-toolbar {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  width: min(1180px, calc(100% - 28px));
  margin: 0 auto 14px;
}

.history-toolbar input {
  min-height: 52px;
  padding: 0 15px;
}

.empty-cell {
  padding: 24px;
  color: var(--muted);
  text-align: center;
}

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 25;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: min(760px, calc(100% - 22px));
  padding: 8px;
  transform: translateX(-50%);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 18px 18px 0 0;
  background: rgba(255,255,255,0.97);
  box-shadow: 0 -8px 24px rgba(20,43,28,0.10);
}

.bottom-nav button {
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
}

.bottom-nav button.active {
  background: var(--green-soft);
  color: var(--green-dark);
}

@media (max-width: 900px) {
  .start-wrap {
    grid-template-columns: 1fr;
    align-items: start;
  }

  .record-layout {
    grid-template-columns: 1fr;
  }

  .side-panel {
    grid-template-columns: 1fr 1fr;
  }

  .choice-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .metric-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 640px) {
  .app-header {
    padding: 11px 13px;
  }

  .brand-mark {
    width: 40px;
    height: 40px;
  }

  .app-header h1 {
    font-size: 19px;
  }

  .app-header p {
    display: none;
  }

  .ghost-button {
    min-height: 40px;
    padding: 0 11px;
    font-size: 13px;
  }

  .start-wrap {
    padding: 20px 13px;
  }

  .hero {
    padding: 5px 2px;
  }

  .hero h2 {
    font-size: 38px;
  }

  .start-card {
    padding: 17px;
  }

  .session-strip {
    width: calc(100% - 18px);
    margin-top: 10px;
  }

  .record-layout,
  .summary-header,
  .metric-grid,
  .summary-actions,
  .summary-table-card,
  .history-toolbar {
    width: calc(100% - 18px);
  }

  .record-card {
    padding: 14px;
  }

  .cow-number-block {
    padding: 14px;
  }

  .cow-number-block input {
    font-size: 36px;
  }

  .score-grid {
    gap: 7px;
  }

  .score {
    min-height: 64px;
    border-radius: 15px;
    font-size: 27px;
  }

  .foot-grid button {
    min-height: 70px;
  }

  .choice-grid button {
    min-height: 62px;
    font-size: 16px;
  }

  .side-panel {
    grid-template-columns: 1fr;
  }

  .sticky-actions {
    width: calc(100% - 10px);
    grid-template-columns: 0.38fr 0.62fr;
    gap: 8px;
    padding: 8px;
  }

  .sticky-actions .secondary-button,
  .sticky-actions .primary-xl {
    min-height: 58px;
    padding: 0 10px;
    font-size: 17px;
  }

  .summary-header {
    flex-direction: column;
  }

  .metric-grid {
    grid-template-columns: 1fr 1fr;
  }

  .metric-card strong {
    font-size: 22px;
  }

  .summary-actions,
  .history-toolbar {
    grid-template-columns: 1fr;
  }

  .bottom-nav {
    width: calc(100% - 10px);
  }
}

select {
  width: 100%;
  min-height: 56px;
  padding: 12px 14px;
  border: 2px solid var(--line);
  border-radius: 15px;
  background: #fff;
  color: var(--text);
  font: inherit;
}
.medicine-details {
  margin-top: 14px;
  padding: 18px;
  border: 2px solid var(--green-soft);
  border-radius: 20px;
  background: #f5faf6;
}
.medicine-details h3 { margin: 0 0 12px; }
.medicine-details input { min-height: 56px; margin: 10px 0 0; padding: 12px 14px; }
.withhold-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.unit-input { display: grid; grid-template-columns: minmax(0,1fr) 110px; gap: 8px; }
.unit-input input { margin: 0; }
.outcome-grid { grid-template-columns: repeat(3,1fr); }
@media (max-width: 640px) {
  .withhold-grid, .outcome-grid { grid-template-columns: 1fr; }
}


.auto-treatment-note {
  margin: 9px 2px 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.withholding-note {
  margin: 10px 2px 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.email-export-note {
  margin: 8px 0 18px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

/* ===== V3.1 PHONE + TABLET RESPONSIVE OVERRIDES ===== */

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

button,
input,
select,
textarea {
  font-size: 16px;
  max-width: 100%;
}

.record-card,
.side-card,
.start-card,
.metric-card,
.summary-table-card {
  min-width: 0;
}

.table-wrap {
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

.sticky-actions {
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}

.bottom-nav {
  padding-bottom: max(8px, env(safe-area-inset-bottom));
}

.side-panel {
  position: sticky;
  top: 92px;
  align-self: start;
}

/* Large tablets and smaller laptops */
@media (min-width: 901px) and (max-width: 1180px) {
  .record-layout {
    grid-template-columns: minmax(0, 1fr) 270px;
  }

  .record-card {
    padding: 19px;
  }

  .choice-grid,
  .outcome-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Tablet portrait and landscape */
@media (min-width: 701px) and (max-width: 900px) {
  .start-wrap {
    grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
    gap: 22px;
  }

  .record-layout {
    grid-template-columns: minmax(0, 1fr) 250px;
    gap: 14px;
  }

  .side-panel {
    grid-template-columns: 1fr;
    position: sticky;
    top: 88px;
  }

  .record-card {
    padding: 18px;
  }

  .choice-grid,
  .outcome-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .metric-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .metric-card {
    padding: 15px;
  }

  .metric-card strong {
    font-size: 24px;
  }
}

/* Narrow tablets and phones */
@media (max-width: 700px) {
  .start-wrap,
  .record-layout {
    grid-template-columns: 1fr;
  }

  .side-panel {
    position: static;
    grid-template-columns: 1fr 1fr;
  }

  .choice-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .metric-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Phone layout */
@media (max-width: 640px) {
  body {
    padding-bottom: calc(74px + env(safe-area-inset-bottom));
  }

  .screen {
    overflow-x: hidden;
  }

  .session-strip {
    padding: 12px 14px;
    border-radius: 15px;
  }

  .session-strip span {
    font-size: 18px;
  }

  .session-count strong {
    font-size: 25px;
  }

  .record-card {
    padding: 13px;
    border-radius: 16px;
  }

  .section-block {
    margin-top: 22px;
  }

  .section-heading {
    align-items: flex-end;
  }

  .section-heading h2 {
    font-size: 21px;
  }

  .cow-number-block input {
    min-height: 62px;
    font-size: 34px;
  }

  .foot-grid {
    gap: 8px;
  }

  .foot-grid button {
    min-height: 68px;
    padding: 8px;
  }

  .foot-grid strong {
    font-size: 24px;
  }

  .choice-grid {
    gap: 8px;
  }

  .choice-grid button {
    min-height: 62px;
  }

  .choice-grid button {
    min-height: 62px;
  }
}
</style>
</head>
<body>
